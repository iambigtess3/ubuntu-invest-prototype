<!doctype html>
<html lang="en">
 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/lynk-icon.png" type="image/png">  <!-- LYNK app icon -->
  <!-- Start loading the welcome artwork straight away (same file as js/illustrations.js → welcome) -->
  <link rel="preload" as="image" href="assets/illustrations/lynk-spiral-loop.webp" type="image/webp" fetchpriority="high">
  <title>App Prototype: Ubuntu Invest</title>
 
  <!-- Brand fonts from Google Fonts: Bricolage Grotesque (headings) and IBM Plex Sans (body).
       Needs an internet connection; without one, the app falls back to the system font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
 
  <!-- Shared design foundation -->
  <link rel="stylesheet" href="css/base.css">
 
  <!-- Screen styles: one file per area -->
  <link rel="stylesheet" href="css/screens/home.css">        <!-- @amtoha-prog -->
  <link rel="stylesheet" href="css/screens/onboarding.css">  <!-- @amtoha-prog -->
  <link rel="stylesheet" href="css/screens/kyc.css">         <!-- identity verification (simulated) -->
  <link rel="stylesheet" href="css/screens/invest.css">      <!-- @iambigtess3 -->
  <link rel="stylesheet" href="css/screens/circle.css">      <!-- @iambigtess3 -->
  <link rel="stylesheet" href="css/screens/profile.css">     <!-- @amtoha-prog -->
  <link rel="stylesheet" href="css/screens/learn.css">       <!-- financial education -->
</head>
<body>
 
  <!-- The phone frame: everything inside it is "the app" -->
  <div class="phone">
 
    <!-- One empty section per tab. Each screen's JS file fills its own section. -->
    <main class="screens">
      <section class="screen" id="home"></section>
      <section class="screen" id="invest"></section>
      <section class="screen" id="circle"></section>
      <section class="screen" id="learn"></section>
      <section class="screen" id="history"></section>  <!-- no tab: opened from Home and Profile -->
      <section class="screen" id="profile"></section>
    </main>
 
    <!-- Bottom tab bar. data-tab must match a section id above. Icons are decorative; the labels name each tab. -->
    <nav class="tabbar" aria-label="Main" data-i18n-attr="aria-label:tab.navLabel">
      <button class="tab" data-tab="home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span data-i18n="tab.home">Home</span>
      </button>
      <button class="tab" data-tab="invest">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span data-i18n="tab.invest">Invest</span>
      </button>
      <button class="tab" data-tab="circle">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="5" r="2.2" fill="currentColor" stroke="none"/><circle cx="18.06" cy="15.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="5.94" cy="15.5" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="tab.circle">Our Circle</span>
      </button>
      <button class="tab" data-tab="learn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23"/><path d="M8 7h8M8 11h6"/></svg>
        <span data-i18n="tab.learn">Learn</span>
      </button>
      <button class="tab" data-tab="profile">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="tab.profile">Profile</span>
      </button>
    </nav>
 
    <!-- Bottom sheets and toasts appear here, inside the phone frame -->
    <div class="overlay-root" id="overlay-root"></div>
    <div class="toast-region" id="toast-region"></div>
 
  </div>
 
  <!-- Prototype disclaimer, always visible during demos -->
  <footer class="prototype-note" data-i18n="app.disclaimer">
    Ubuntu Invest prototype. All prices, balances and returns are simulated sample data.
    No real money, trades or accounts are involved, and the broker partnership is proposed.
  </footer>
 
  <!-- Screen-reader announcements (filled by js/ui.js) -->
  <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>
 
  <!-- Translations: the system first, then one file per language (English is the fallback) -->
  <script src="js/i18n.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/rw.js"></script>
  <script src="js/i18n/fr.js"></script>

  <!-- Shared helpers and sample data: must load before the screen files -->
  <script src="js/brand.js"></script>          <!-- logo: change it in one place -->
  <script src="js/illustrations.js"></script>  <!-- illustrations: change them in one place -->
  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>

  <!-- Screen files: one per area -->
  <script src="js/screens/home.js"></script>
  <script src="js/screens/invest.js"></script>
  <script src="js/screens/our-circle.js"></script>
  <script src="js/screens/learn.js"></script>        <!-- financial education -->
  <script src="js/screens/history.js"></script>      <!-- opened from Home and Profile -->
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/kyc.js"></script>          <!-- identity verification (simulated) -->
  <script src="js/screens/onboarding.js"></script>   <!-- shown over the app on load -->

  <!-- Shared navigation: must load last, after all screens are defined -->
  <script src="js/app.js"></script>

  <!-- Apply the saved language to the static text above -->
  <script>I18N.applyStatic();</script>
</body>
</html>
